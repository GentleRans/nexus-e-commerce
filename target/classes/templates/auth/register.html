<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Register')}"></head>
<body class="auth-page">

<div class="auth-container">
    <a href="/" class="logo" style="display:block;text-align:center;margin-bottom:2rem">NEXUS</a>
    <div class="auth-card">
        <h2>Create Account</h2>
        <p class="auth-sub">Join NEXUS and start shopping</p>

        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <form th:action="@{/register}" method="post" th:object="${registerDTO}" class="auth-form">
            <div class="form-row">
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" th:field="*{firstName}" class="form-input" placeholder="John">
                    <span th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" class="field-error"></span>
                </div>
                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" th:field="*{lastName}" class="form-input" placeholder="Doe">
                    <span th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" class="field-error"></span>
                </div>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" th:field="*{email}" class="form-input" placeholder="you@email.com">
                <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="field-error"></span>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" th:field="*{password}" class="form-input" placeholder="Min 6 characters">
                <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="field-error"></span>
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" th:field="*{confirmPassword}" class="form-input" placeholder="Repeat password">
            </div>
            <button type="submit" class="btn-primary" style="width:100%;padding:1rem">Create Account</button>
        </form>

        <p class="auth-link">Already have an account? <a href="/login">Login</a></p>
    </div>
</div>

</body>
</html>
