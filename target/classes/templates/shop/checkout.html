<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Checkout')}"></head>
<body>
<div class="banner-strip">🔒 Secure Checkout</div>
<nav th:replace="~{layout :: navbar}"></nav>

<div class="section">
    <h1 class="section-title" style="margin-bottom:2rem">CHECK<span>OUT</span></h1>

    <div class="checkout-layout">
        <div class="checkout-form-col">
            <form th:action="@{/checkout}" method="post" class="checkout-form">
                <h3>Shipping Information</h3>
                <div class="form-group">
                    <label>Street Address</label>
                    <input type="text" name="address" required class="form-input" placeholder="123 Main Street">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>City</label>
                        <input type="text" name="city" required class="form-input" placeholder="City">
                    </div>
                    <div class="form-group">
                        <label>Country</label>
                        <input type="text" name="country" required class="form-input" placeholder="Country">
                    </div>
                </div>
                <hr style="border-color:var(--border);margin:2rem 0">
                <h3>Payment (Demo)</h3>
                <div class="form-group">
                    <label>Card Number</label>
                    <input type="text" class="form-input" placeholder="**** **** **** ****" value="4242 4242 4242 4242" readonly>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Expiry</label>
                        <input type="text" class="form-input" placeholder="MM/YY" value="12/26" readonly>
                    </div>
                    <div class="form-group">
                        <label>CVV</label>
                        <input type="text" class="form-input" placeholder="123" value="123" readonly>
                    </div>
                </div>
                <button type="submit" class="btn-primary" style="width:100%;padding:1.1rem;font-size:1rem;margin-top:1rem">
                    🎉 Place Order — $<span th:text="${total}">0</span>
                </button>
            </form>
        </div>

        <div class="checkout-summary-col">
            <h3>Your Order</h3>
            <div th:each="item : ${cartItems}" class="summary-item">
                <span th:text="${item.emoji}">📦</span>
                <span class="summary-item-name" th:text="${item.name}">Product</span>
                <span>x<span th:text="${item.quantity}">1</span></span>
                <span th:text="'$' + ${item.subtotal}">$0</span>
            </div>
            <hr style="border-color:var(--border);margin:1rem 0">
            <div class="summary-row total">
                <strong>Total</strong>
                <strong th:text="'$' + ${total}">$0</strong>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
