# ===================================
# NEXUS E-Commerce - Configuration
# ===================================

# Application
spring.application.name=nexus-ecommerce
server.port=8085

# ===================================
# DATABASE - MySQL
# Change password to your MySQL password
# ===================================
spring.datasource.url=jdbc:mysql://localhost:3306/nexus_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================
# JPA / HIBERNATE
# ===================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===================================
# THYMELEAF
# ===================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ===================================
# FILE UPLOAD
# ===================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===================================
# LOGGING
# ===================================
logging.level.com.nexus=DEBUG
logging.level.org.springframework.security=INFO
