<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Admin — Orders')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<div class="section">
    <h1 class="section-title" style="margin-bottom:2rem">MANAGE <span>ORDERS</span></h1>
    <div th:if="${param.updated}" class="alert alert-success">Order status updated!</div>
    <div class="orders-table-wrapper">
        <table class="orders-table">
            <thead>
                <tr><th>Order #</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Date</th><th>Update</th></tr>
            </thead>
            <tbody>
                <tr th:each="order : ${orders}">
                    <td th:text="${order.orderNumber}"></td>
                    <td th:text="${order.user.fullName}"></td>
                    <td th:text="${#lists.size(order.items)} + ' items'"></td>
                    <td th:text="'$' + ${order.totalAmount}"></td>
                    <td><span class="status-badge" th:classappend="${order.status}" th:text="${order.status}"></span></td>
                    <td th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy')}"></td>
                    <td>
                        <form th:action="@{/admin/orders/{id}/status(id=${order.id})}" method="post" style="display:flex;gap:0.5rem">
                            <select name="status" class="sort-select" style="font-size:0.75rem;padding:0.3rem">
                                <option th:each="s : ${ {'PENDING','CONFIRMED','SHIPPED','DELIVERED','CANCELLED'} }"
                                        th:value="${s}" th:text="${s}"
                                        th:selected="${s == order.status.name()}">Status</option>
                            </select>
                            <button type="submit" class="add-to-cart" style="padding:0.3rem 0.7rem;font-size:0.75rem">✓</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
