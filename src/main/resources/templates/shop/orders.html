<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('My Orders')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<div class="section">
    <h1 class="section-title" style="margin-bottom:2rem">MY <span>ORDERS</span></h1>

    <div th:if="${#lists.isEmpty(orders)}" class="empty-state">
        <div style="font-size:4rem">📦</div>
        <h2>No orders yet</h2>
        <p>Start shopping to place your first order!</p>
        <a href="/shop" class="btn-primary">Shop Now</a>
    </div>

    <div th:unless="${#lists.isEmpty(orders)}" class="orders-table-wrapper">
        <table class="orders-table">
            <thead>
                <tr>
                    <th>Order #</th>
                    <th>Date</th>
                    <th>Items</th>
                    <th>Total</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="order : ${orders}">
                    <td th:text="${order.orderNumber}">NXS-001</td>
                    <td th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy')}">Date</td>
                    <td th:text="${#lists.size(order.items)} + ' items'">0 items</td>
                    <td th:text="'$' + ${order.totalAmount}">$0</td>
                    <td>
                        <span class="status-badge" th:classappend="${order.status}" th:text="${order.status}">PENDING</span>
                    </td>
                    <td>
                        <a th:href="@{/orders/{id}(id=${order.id})}" class="btn-outline-sm">View</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<footer th:replace="~{layout :: footer}"></footer>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
